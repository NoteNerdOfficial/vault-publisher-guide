<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review demo: a prototype in a phone frame</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    gap: 16px;
    padding: 32px 16px;
    box-sizing: border-box;
    font: 15px/1.5 system-ui, sans-serif;
    background: #e9e6df;
    color: #222;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1c1b19; color: #ddd; }
  }
  .caption { max-width: 360px; text-align: center; margin: 0; }
  .phone {
    width: 320px;
    height: 640px;
    padding: 14px;
    border-radius: 44px;
    background: #111;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
  }
  .phone iframe {
    width: 100%;
    height: 100%;
    border: 0;
    border-radius: 32px;
    background: #fff;
  }
</style>
</head>
<body>
  <p class="caption">
    The frame is this page; the app is the page inside it. With the review
    overlay on, only this page gets a toolbar.
  </p>
  <div class="phone">
    <iframe src="screens/basket.html" title="The prototype's screen"></iframe>
  </div>
</body>
</html>
